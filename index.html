<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Risk Monitor - Fixed</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
    <style>
        /* CSS tetap sama seperti milik Anda untuk mempertahankan desain */
        :root{ --bg0:#f4f6fa;--bg1:#ffffff;--bg2:#f0f2f7;--bg3:#e4e8f0; --tx1:#0f1117;--tx2:#3d4a5c;--tx3:#7a8699; --br:#dde2ec;--br2:#c5cdd9; --blu:#185fa5;--blu-bg:#e6f1fb;--blu-tx:#0c447c; --grn:#3b6d11;--grn-bg:#eaf3de;--grn-tx:#27500a; --red:#a32d2d;--red-bg:#fcebeb;--red-tx:#791f1f; --amb:#854f0b;--amb-bg:#faeeda;--amb-tx:#633806; --pur:#534ab7;--pur-bg:#eeedfe;--pur-tx:#3c3489; --tel:#0f6e56;--tel-bg:#e1f5ee;--tel-tx:#085041; }
        .dark{ --bg0:#070b15;--bg1:#0d1424;--bg2:#111c30;--bg3:#1a2540; --tx1:#eef2ff;--tx2:#94a3b8;--tx3:#475569; --br:#1e2d4a;--br2:#2d3f5a; --blu:#378add;--blu-bg:#0c1e35;--blu-tx:#85b7eb; --grn:#639922;--grn-bg:#0a1f07;--grn-tx:#c0dd97; --red:#e24b4a;--red-bg:#1f0808;--red-tx:#f09595; --amb:#ef9f27;--amb-bg:#1e0f00;--amb-tx:#fac775; --pur:#7f77dd;--pur-bg:#1a1840;--pur-tx:#afa9ec; --tel:#1d9e75;--tel-bg:#041e17;--tel-tx:#9fe1cb; }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:sans-serif;background:var(--bg0);color:var(--tx1);font-size:13px}
        .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px;background:var(--bg1);border-bottom:1px solid var(--br)}
        .tabs{display:flex;background:var(--bg1);border-bottom:1px solid var(--br);padding:0 10px;gap:15px;overflow-x:auto}
        .tab{padding:12px 5px;font-size:12px;cursor:pointer;color:var(--tx3);border-bottom:2px solid transparent}
        .tab.on{color:var(--blu);border-bottom-color:var(--blu)}
        .view{display:none;padding:15px}
        .view.on{display:block}
        .card{background:var(--bg1);border:1px solid var(--br);border-radius:10px;padding:15px;margin-bottom:10px}
        .inp{width:100%;padding:8px;margin-bottom:10px;background:var(--bg2);border:1px solid var(--br);border-radius:5px;color:var(--tx1)}
        .btn{padding:10px;border-radius:5px;cursor:pointer;border:none;width:100%;font-weight:bold}
        .bp{background:var(--blu);color:white}
        .bs{background:var(--grn);color:white}
        #map1, #map2 { height: 300px; width: 100%; border-radius: 10px; margin-top: 10px; z-index: 1; }
    </style>
</head>
<body class="dark">

<div class="topbar">
    <div style="font-weight:bold">Asset Risk Monitor v2</div>
    <button onclick="toggleTheme()" style="padding:4px 10px; border-radius:15px; cursor:pointer">Ganti Tema</button>
</div>

<div class="tabs">
    <div class="tab on" id="t-dash" onclick="gotoTab('dash')">Dashboard</div>
    <div class="tab" id="t-map" onclick="gotoTab('map')">Peta</div>
    <div class="tab" id="t-enroll" onclick="gotoTab('enroll')">Pendaftaran</div>
</div>

<div class="view on" id="view-dash">
    <div class="card">
        <h3>Status Aset</h3>
        <div id="dash-list">Belum ada aset terdaftar.</div>
    </div>
</div>

<div class="view" id="view-map">
    <div class="card">
        <h3>Live GPS Map</h3>
        <div id="map1"></div>
    </div>
</div>

<div class="view" id="view-enroll">
    <div class="card">
        <h3>Pendaftaran Device Baru
