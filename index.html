<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Risk Monitor - Cloud Sync</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg0:#f4f6fa; --bg1:#ffffff; --blu:#185fa5; --tx1:#0f1117; --br:#dde2ec;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg0); margin: 0; padding: 20px; color: var(--tx1); }
        .container { max-width: 800px; margin: auto; }
        .card { background: var(--bg1); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid var(--br); }
        h2 { margin-top: 0; color: var(--blu); display: flex; align-items: center; gap: 10px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid var(--br); border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-primary { background: var(--blu); color: white; }
        .btn-primary:hover { opacity: 0.9; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #eee; }
        .online { background: #eaf3de; color: #3b6d11; }
        #asset-list { margin-top: 15px; }
        .asset-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        #map { height: 300px; border-radius: 12px; border: 1px solid var(--br); margin-top: 10px; }
        .sync-info { font-size: 12px; color: #7a8699; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🛰️ Asset Tracker Cloud</h2>
        <p style="font-size: 14px; color: #666;">Data tersinkron otomatis antara HP & Laptop via Supabase.</p>
        
        <input type="text" id="asset-id" placeholder="Masukkan Device ID (Contoh: SEUIC-001)">
        <input type="text" id="asset-name" placeholder="Masukkan Nama Aset (Contoh: Forklift A)">
        <button class="btn btn-primary" onclick="enrollAsset()">+ Enroll ke Cloud</button>
    </div>

    <div class="card">
        <h3>Daftar Aset Terdaftar</h3>
        <div id="asset-list">Sedang memuat data...</div>
    </div>

    <div class="card">
        <h3>Lokasi Real-time</h3>
        <div id="map"></div>
    </div>
    
    <p class="sync-info" id="last-update">Status: Menghubungkan ke server...</p>
</div>

<script>
    // --- KONEKSI OTOMATIS KE SUPABASE LU ---
    const SUPABASE_URL = 'https://uappnmhaqblzittbjmsi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_DCWTb1BAzQOgO8-sSmlEyg_7dc_jS2X';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let assets = [];
    let map = L.map('map').setView([-6.2000, 106.8166], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Fungsi Ambil Data (Load)
    async function loadFromCloud() {
        const { data, error } = await _supabase.from('assets').select('*');
        if (error) {
            console.error("Error:", error);
            document.getElementById('last-update').innerText = "Gagal sinkron data.";
        } else {
            assets = data;
            renderList();
            document.getElementById('last-update').innerText = "Update Terakhir: " + new Date().toLocaleTimeString();
        }
    }

    // Fungsi Simpan Data (Save)
    async function enrollAsset() {
        const idInput = document.getElementById('asset-id');
        const nameInput = document.getElementById('asset-name');
        
        if(!idInput.value || !nameInput.value) return alert("Isi ID dan Nama dulu!");

        const newAsset = {
            id: idInput.value,
            name: nameInput.value,
            sw_status: 'online',
            last_seen: new Date().toISOString()
        };

        const { error } = await _supabase.from('assets').upsert(newAsset);
        
        if (error) {
            alert("Gagal simpan! Pastikan tabel 'assets' sudah dibuat di Supabase.");
        } else {
            alert("Berhasil! Data terkirim ke Cloud.");
            idInput.value = '';
            nameInput.value = '';
            loadFromCloud();
        }
    }

    // Fungsi Tampilan
    function renderList() {
        const listDiv = document.getElementById('asset-list');
        if (assets.length === 0) {
            listDiv.innerHTML = "<p style='color:#999'>Belum ada aset. Tambahkan di atas.</p>";
            return;
        }
        
        listDiv.innerHTML = assets.map(a => `
            <div class="asset-item">
                <div>
                    <strong>${a.id}</strong><br>
                    <small>${a.name}</small>
                </div>
                <span class="status-badge online">${a.sw_status || 'online'}</span>
            </div>
        `).join('');
    }

    // Jalankan otomatis
    loadFromCloud();
    // Re-sync setiap 5 detik agar HP & Laptop tetap sama datanya
    setInterval(loadFromCloud, 5000);
</script>

</body>
</html>
